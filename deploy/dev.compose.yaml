services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: statistics-dev-db
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    volumes:
      - dev-db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    init: true
    environment:
      SITE_NAME: statistics.localhost
      DB_ROOT_PASSWORD: statistics-dev-db
      ADMIN_PASSWORD: statistics-dev-admin
    volumes:
      - dev-bench:/workspace
      - ../:/src/statistics_diy:z
    ports:
      - "127.0.0.1:${STATISTICS_DIY_DEV_PORT:-8000}:8000"
      - "127.0.0.1:${STATISTICS_DIY_DEV_SOCKETIO_PORT:-9000}:9000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dev-db:
  dev-bench:
