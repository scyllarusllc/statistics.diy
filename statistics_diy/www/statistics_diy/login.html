{% extends "statistics_diy/templates/admin.html" %}
{% block content %}
<div class="mx-auto my-12 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><p class="mb-2 text-xs font-semibold tracking-widest text-indigo-600">{{ t('WELCOME BACK') }}</p><h1 class="text-2xl font-bold">{{ t('Sign in to Statistics DIY') }}</h1><p class="mt-2 text-sm text-slate-500">{{ t('Sign in with your administrator account to view analytics.') }}</p><form id="login-form" class="mt-7 space-y-5"><label class="block text-sm font-medium">{{ t('Account') }}<input name="usr" required autocomplete="username" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></label><label class="block text-sm font-medium">{{ t('Password') }}<input name="pwd" type="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></label><p id="login-status" class="text-sm text-red-600" role="alert"></p><button type="submit" class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white disabled:opacity-50">{{ t('Sign in') }}</button></form></div>
{% endblock %}
{% block scripts %}<script src="/assets/statistics_diy/js/login.js?v=20261006-city"></script>{% endblock %}
